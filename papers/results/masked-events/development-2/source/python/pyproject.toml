[project]
name = "chuff-mpu"
version = "0.1.0"
description = "Chuff robotic pet - Arduino UNO Q / MPU-side Python (audio, mood, IPC to MCU)"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aidan Jones", email = "aidanjones@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.4.6",
    "pyserial>=3.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.15",
    "sounddevice>=0.5.6",
]

[project.scripts]
chuff-mvp-demo = "chuff_mpu.mvp_demo:main"
chuff-sim = "chuff_mpu.sim.run_demo:main"
chuff-sim-2unit = "chuff_mpu.sim.two_unit_demo:main"
chuff-sim-memory = "chuff_mpu.sim.memory_eviction_experiment:main"
chuff-sim-dsl = "chuff_mpu.sim.dsl_evolution_demo:main"
chuff-sim-grounding = "chuff_mpu.sim.grounding_demo:main"
chuff-sim-babble = "chuff_mpu.sim.babbling_experiment:main"
chuff-sim-mood = "chuff_mpu.sim.mood_demo:main"
chuff-sim-attention = "chuff_mpu.sim.attention_experiment:main"
chuff-selective = "chuff_mpu.selective_demo:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"
